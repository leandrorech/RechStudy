<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RechStudy</title></head>
<body>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(rgba(4,18,13,.62),rgba(5,20,15,.74)),url("assets/bg/rechstudy-family.webp") center center/cover fixed no-repeat,#10211b;color:#f3f5ef;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(16,33,27,.04) 25%,rgba(2,12,9,.54) 100%);z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.app{width:100%;max-width:1600px;margin:0 auto;padding:16px}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:0.5px solid #173d1f}
.logo{width:28px;height:28px;border-radius:8px;background:#006633;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab{padding:5px 11px;border-radius:6px;border:0.5px solid #173d1f;font-size:12px;cursor:pointer;white-space:nowrap;background:#0c110c;color:#7aab7a;transition:all .15s}
.tab.active{background:#005a1e;border-color:#00cc44;color:#00ff55;font-weight:500}
.panel{background:#0c110c;border:0.5px solid #173d1f;border-radius:10px;padding:14px;margin-bottom:10px}
input[type=text]{width:100%;background:#112916;border:0.5px solid #173d1f;border-radius:6px;padding:7px 11px;color:#e8f5e9;font-size:13px;outline:none;transition:border-color .15s;margin-bottom:8px;font-family:inherit}
input[type=text]:focus{border-color:#166534}
.lbl{font-size:10px;color:#7aab7a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.opt{padding:3px 9px;border-radius:6px;border:0.5px solid #173d1f;font-size:11px;cursor:pointer;background:#0c110c;color:#7aab7a;transition:all .15s}
.opt.sel{background:#052e16;border-color:#166534;color:#86efac;font-weight:500}
.opt.sel-w{background:#451a03;border-color:#d97706;color:#fbbf24;font-weight:500}
.btn{padding:9px 14px;border-radius:6px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-g{background:#006633;color:#fff;width:100%}
.btn-g:hover:not(:disabled){background:#008844}
.btn-t{background:#004d22;color:#fff}
.btn-t:hover:not(:disabled){background:#006633}
.btn-sm{padding:4px 9px;border-radius:6px;border:0.5px solid #173d1f;font-size:11px;cursor:pointer;background:#0b0f0b;color:#7aab7a}
.btn-sm:hover{border-color:#1a4d2a;color:#e8f5e9}
.btn-dl{padding:4px 9px;border-radius:6px;border:0.5px solid #166534;font-size:11px;cursor:pointer;background:#0b0f0b;color:#86efac}
.btn-dl:hover{background:#052e16}
.err{background:#2a0a0a;border:0.5px solid #7f1d1d;color:#f87171;padding:7px 11px;border-radius:6px;font-size:12px;margin-top:6px}
.nh{font-size:10px;padding:3px 8px;border-radius:6px;margin-top:3px;display:inline-block}
.nh-b{background:#112916;color:#7aab7a}
.nh-i{background:#0a1a2a;color:#60a5fa}
.nh-a{background:#251500;color:#fbbf24}
.nh-e{background:#2a0a0a;color:#f87171}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spin-sm{display:inline-block;width:9px;height:9px;border:1.5px solid #166534;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cpanel{background:#0c110c;border:0.5px solid #173d1f;border-radius:10px;padding:14px;margin-bottom:10px}
.rhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;padding-bottom:8px;border-bottom:0.5px solid #173d1f}
.rtag{font-size:10px;text-transform:uppercase;color:#86efac;letter-spacing:.05em;margin-bottom:2px}
.content{font-size:13px;line-height:1.72;color:#e8f5e9}
.content h2{font-size:14px;font-weight:500;color:#86efac;margin:16px 0 5px;display:flex;align-items:center;gap:5px}
.content h2::before{content:'';display:inline-block;width:3px;height:14px;background:#006633;border-radius:2px;flex-shrink:0}
.content h3{font-size:13px;font-weight:500;color:#60a5fa;margin:9px 0 3px}
.content h4{font-size:12px;font-weight:500;color:#7aab7a;margin:7px 0 2px}
.content p{margin-bottom:6px}
.content li{margin-left:16px;margin-bottom:2px}
.content ul li{list-style:disc}
.content ol li{list-style:decimal}
.content strong{font-weight:500}
.content code{background:#112916;color:#86efac;padding:1px 4px;border-radius:3px;font-size:11px;font-family:monospace}
.content pre{background:#112916;border:0.5px solid #173d1f;padding:10px;border-radius:6px;font-size:11px;font-family:monospace;overflow-x:auto;margin:6px 0;white-space:pre}
.content hr{border:none;border-top:0.5px solid #173d1f;margin:8px 0}
.content table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.content th{border:0.5px solid #1a4d2a;padding:5px 7px;text-align:left;background:#112916;color:#86efac;font-weight:500}
.content td{border:0.5px solid #173d1f;padding:4px 7px}
.content tr:nth-child(even) td{background:#112916}
.prog-bar{height:4px;background:#112916;border-radius:2px;margin:5px 0;overflow:hidden}
.prog-fill{height:100%;background:#006633;border-radius:2px;transition:width .4s}
.blocos-list{display:flex;flex-direction:column;gap:2px;max-height:380px;overflow-y:auto;margin:8px 0}
.brow{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;border:0.5px solid #173d1f;cursor:pointer;transition:all .15s;background:#0d1f10}
.brow:hover{border-color:#1a4d2a;background:#112916}
.brow.done{border-color:#166534;background:#052e16}
.brow.sel{border-color:#d97706;background:#251500}
.brow.loading{border-color:#1e3a5f;background:#0a1a2a}
.bnum{font-size:10px;font-family:monospace;color:#7aab7a;min-width:20px}
.mbadge{font-size:9px;padding:1px 4px;border-radius:3px;font-weight:500;flex-shrink:0}
.mf{background:#0a1a2a;color:#60a5fa}
.mfi{background:#052e16;color:#86efac}
.md{background:#251500;color:#fbbf24}
.mt{background:#2e1065;color:#c4b5fd}
.mu{background:#2a0a0a;color:#f87171}
.mp{background:#112916;color:#7aab7a}
.btitulo{font-size:12px;flex:1;color:#e8f5e9}
.bstatus{font-size:12px;flex-shrink:0;min-width:16px;text-align:center}
.msep{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7aab7a;margin:7px 0 2px 3px}
.card{background:#112916;border:0.5px solid #1a4d2a;border-radius:10px;padding:16px;min-height:120px;cursor:pointer;transition:border-color .15s;margin-bottom:8px}
.card:hover{border-color:#166534}
.card.flipped{border-color:#166534}
.df{font-size:10px;padding:2px 6px;border-radius:20px;background:#052e16;border:0.5px solid #166534;color:#86efac}
.dm{font-size:10px;padding:2px 6px;border-radius:20px;background:#251500;border:0.5px solid #78350f;color:#fbbf24}
.dd{font-size:10px;padding:2px 6px;border-radius:20px;background:#2a0a0a;border:0.5px solid #7f1d1d;color:#f87171}
.rrow{display:flex;gap:6px;margin-top:8px}
.rb{flex:1;padding:7px;border-radius:6px;border:0.5px solid;font-size:12px;font-weight:500;cursor:pointer;background:#0b0f0b;transition:all .15s}
.rok{border-color:#166534;color:#86efac}.rok:hover{background:#052e16}
.rhd{border-color:#78350f;color:#fbbf24}.rhd:hover{background:#251500}
.rer{border-color:#7f1d1d;color:#f87171}.rer:hover{background:#2a0a0a}
.gabh{background:#112916;border:0.5px dashed #1a4d2a;border-radius:6px;padding:10px;text-align:center;font-size:12px;color:#7aab7a;margin-top:8px}
.hi{border:0.5px solid #173d1f;border-radius:10px;overflow:hidden;margin-bottom:7px}
.hh{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#112916}
.empty{text-align:center;padding:24px;color:#7aab7a;font-size:13px}

/* ── MOBILE RESPONSIVE ─────────────────────────────── */
@media(max-width:600px){
  .hdr{flex-wrap:nowrap;padding:8px 10px;gap:6px}
  .hdr img{height:50px!important;width:42px!important}
  .hdr .logo{width:28px;height:28px;font-size:13px;flex-shrink:0}
  .hdr>div:nth-child(3){flex:1;min-width:0}
  .hdr>div:nth-child(3) div:first-child{font-size:12px}
  .hdr>div:nth-child(3) div:last-child{font-size:9px}
  .hdr>div:last-child{flex-shrink:0;display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
  .hdr>div:last-child button,.hdr>div:last-child select{font-size:9px!important;padding:3px 6px!important}
  .app{padding:8px}
  .tabs{gap:2px;padding-bottom:4px}
  .tab{padding:5px 8px;font-size:10px;white-space:nowrap}
  .panel,.card,.cpanel{padding:10px}
  .row2{grid-template-columns:1fr!important}
  .opts{flex-wrap:wrap}
  .btn{padding:8px 12px;font-size:13px}
  .btn-g{width:100%;justify-content:center;padding:10px}
  input[type=text],input[type=number],select,textarea{font-size:16px!important}
  .grid2,.grid3{grid-template-columns:1fr!important}
  .layer-badges{gap:3px}
  .layer-badge{font-size:9px;padding:2px 5px}
  .supp-grid{grid-template-columns:1fr!important}
}
@media(max-width:400px){
  .hdr img{display:none}
  .tab{font-size:9px;padding:4px 6px}
}
</style>

function errMsg(status,body){
  if(status===401)return"⚠️ API Key inválida — verifique em console.anthropic.com";
  if(status===429)return"⏳ Rate limit — tentando novamente...";
  if(status===529)return"🔄 API sobrecarregada — tentando novamente...";
  if(status===400)return"❌ Parâmetro inválido — "+(body?.error?.message||"verifique modelo/prompt");
  if(status===413)return"📏 Prompt muito longo";
  return"Erro HTTP "+status+(body?.error?.message?" — "+body.error.message:"");
}
async function api(sys,user,tokensKey="default"){
  const key=getKey()||getKeySession();
  if(!key)throw new Error("API Key não configurada — clique em 🔑 API Key");
  const model=S.model||"claude-sonnet-4-6";
  const ctx=baseContext();
  if(ctx){sys=String(sys||"")+ctx;user=`${ctx}\n\n--- [TAREFA DO APP] ---\n${user}`;}
  const max_tokens=TOKENS[tokensKey]||TOKENS.default;
  let attempt=0;
  while(attempt<3){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),90000);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",signal:controller.signal,
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model,max_tokens,system:sys,messages:[{role:"user",content:user}]})
      });
      clearTimeout(timer);
      const d=await r.json().catch(()=>({}));
      if(!r.ok){
        if((r.status===429||r.status===529)&&attempt<2){attempt++;await new Promise(res=>setTimeout(res,3500*attempt));continue;}
        throw new Error(errMsg(r.status,d));
      }
      const t=d.content?.map(b=>b.text||"").join("")||"";
      if(!t)throw new Error("Resposta vazia");
      return t;
    }catch(ex){
      clearTimeout(timer);
      if(ex.name==="AbortError")throw new Error("⏰ Timeout (90s) — tente novamente ou mude para Haiku.");
      if(attempt>=2)throw ex;
      attempt++;
    }
  }
  throw new Error("Falha após 3 tentativas.");
}

async function consolidar(){
  const run=newRun();
  if(!S.rcRevisaoGPT&&!S.rcRevisaoGemini){alert("Cole pelo menos uma revisão antes de consolidar.");return;}
  const btn=document.getElementById("btn_consol");
  if(btn){btn.disabled=true;btn.textContent="Consolidando...";}
  const mainEl=document.getElementById("main");
  const out=document.getElementById("consol_out");
  const conteudoOriginal=S.resultQ||S.resultP||S.resultS||"(conteúdo não disponível diretamente — use o que foi gerado na aba anterior)";
  const sys=`Você é um médico intensivista sênior fazendo consolidação de revisão técnica. Integre o conteúdo original com as revisões críticas. Produza uma versão final corrigida, mais segura e completa. Destaque em **negrito** correções importantes. Use ⚠️ para alertas clínicos. Inclua seção ## ✅ O que foi corrigido ao final.`;
  const prompt=`CONTEÚDO ORIGINAL:\n${conteudoOriginal}\n\nREVISÃO CHATGPT:\n${S.rcRevisaoGPT||"(não fornecida)"}\n\nREVISÃO GEMINI:\n${S.rcRevisaoGemini||"(não fornecida)"}\n\nTEMA: ${S.tema||"não informado"}\nNÍVEL: ${S.nivel||"Expert UTI"}\n\nConsolide em uma versão final integrada, corrigindo erros identificados e incorporando complementações válidas. Destaque divergências entre os modelos revisores.`;
  try{
    const r=await api(sys,prompt,"revisao");
    if(!isRunActive(run))return;
    S.rcConsolidado=r;
    S.contentStatus="consolidated";
    document.getElementById("main").innerHTML=rRevisaoCritica();
  }catch(ex){
    if(out)out.innerHTML=`<div class="err">Erro: ${ex.message}</div>`;
    if(btn){btn.disabled=false;btn.textContent="▶ Consolidar com Claude";}
  }
}

async function auditarRisco(){
  const run=newRun();
  const btn=document.getElementById("btn_audit");
  const out=document.getElementById("audit_out");
  if(btn){btn.disabled=true;btn.textContent="Auditando...";}
  const mainEl=document.querySelector(".content");
  const conteudo=mainEl?mainEl.innerText:"";
  if(!conteudo||conteudo.length<50){
    if(out)out.innerHTML=`<div class="err">Gere conteúdo em outra aba primeiro.</div>`;
    if(btn){btn.disabled=false;btn.textContent="🚨 Auditar Riscos";}
    return;
  }
  const sys=`Você é um auditor de segurança clínica em medicina intensiva. Seu papel é encontrar problemas, NÃO fazer resumo.`;
  const prompt=`Analise o seguinte conteúdo médico gerado por IA e identifique APENAS:\n\n1. Condutas perigosas se aplicadas literalmente\n2. Doses ausentes ou incorretas\n3. Limiares rígidos que precisam de contexto (ex: "sempre", "nunca", "gold standard", "meta X")\n4. Contraindicações não mencionadas\n5. Simplificações que podem causar dano\n6. Falsa segurança (parece completo mas não é)\n7. Pontos onde "fazer nada" ou "aguardar" é mais seguro que a conduta sugerida\n8. Interações medicamentosas ausentes\n9. Ajustes renais/hepáticos não citados\n10. Situações especiais ignoradas (idoso, DRC, gestante, obeso, imunossuprimido)\n\nFormato de saída:\n## 🚨 Riscos identificados\n[lista numerada com nível: ALTO/MODERADO/BAIXO]\n\n## ✅ O que está seguro\n[breve lista]\n\n## 📋 Checklist de segurança obrigatório antes de usar\n[lista de verificações]\n\nCONTEÚDO:\n${conteudo}`;
  try{
    const r=await api(sys,prompt,"calc_ai");
    if(!isRunActive(run))return;
    if(out)out.innerHTML=`<div class="content">${mdR(r)}</div>`;
  }catch(ex){
    if(out)out.innerHTML=`<div class="err">Erro: ${ex.message}</div>`;

function agCalc(){

  const{ag,agCorr}=RechCalc.anionGapCore(na,cl,hco3,alb);

function vmBCalc(){
  if(!window.vmBSex)window.vmBSex="M";
  const pplat=cN("vm_pplat"),peep=cN("vm_peep"),vt=cN("vm_vt"),h=cN("vm_h");
  const pao2=cN("vm_pao2"),fio2=cN("vm_fio2"),fr=cN("vm_fr"),p01=cN("vm_p01"),vtsp=cN("vm_vtsp");
  let out="";
  const pbw=RechCalc.calcPBW(window.vmBSex,h);
  if(!isNaN(pbw))out+=`<div>PBW (${window.vmBSex==="M"?"♂":"♀"} ${isNaN(h)?"?":h}cm): ${cFmt(pbw,"kg")}</div>`;
  if(!isNaN(pplat)&&!isNaN(peep)){
    const dp=RechCalc.drivingPressure(pplat,peep);
    const{msg:dpMsg,col}=RechCalc.classifyDPBeiraleito(dp);
    out+=`<div style="margin-top:6px">Driving Pressure: ${cFmt(dp,"cmH₂O")}${cAlrt(dpMsg,col)}</div>`;
    if(!isNaN(vt)&&vt>0){
      const cst=RechCalc.staticCompliance(vt,pplat,peep);
      const{msg:cstMsg,col:cstCol}=RechCalc.classifyComplianceBeiraleito(cst);
      out+=`<div style="margin-top:6px">Compliance estática: ${cFmt(cst,"mL/cmH₂O")}${cAlrt(cstMsg,cstCol)}</div>`;
      if(!isNaN(pbw)&&pbw>0){
        const vtkg=RechCalc.calcVtPerKgPBW(vt,pbw);
        const{msg:vtMsg,col:vtCol}=RechCalc.classifyVtKgBeiraleito(vtkg);
        out+=`<div style="margin-top:6px">Vt/kg PBW: ${cFmt(vtkg,"mL/kg")}${cAlrt(vtMsg,vtCol)}</div>`;
      }
    }
  }
  if(!isNaN(pao2)&&!isNaN(fio2)&&fio2>0){
    const pf=RechCalc.pfRatio(pao2,fio2);
    const{grau,col}=RechCalc.classifyPF(pf);
    out+=`<div style="margin-top:6px">P/F: ${cFmt(pf,"",0)} ${cAlrt("SDRA "+grau+" — Berlim 2012",col)}</div>`;
  }
  if(!isNaN(fr)&&!isNaN(vtsp)&&vtsp>0){
    const tobin=RechCalc.tobinIndex(fr,vtsp);
    const{msg:tobinMsg,col:tobinCol}=RechCalc.classifyTobinBeiraleito(tobin);
    out+=`<div style="margin-top:6px">Índice de Tobin (f/Vt): ${cFmt(tobin,"ipm/L",0)}${cAlrt(tobinMsg,tobinCol)}</div>`;
  }
  if(!isNaN(p01)){
    const{msg:p01Msg,col:p01Col}=RechCalc.classifyP01Beiraleito(p01);
    out+=`<div style="margin-top:6px">P0.1: ${cFmt(p01,"cmH₂O")}${cAlrt(p01Msg,p01Col)}</div>`;
  }
  if(!out)out="<span style='color:#4a7a4a'>Preencha os campos para calcular.</span>";
  cSet("vmb",out);
}

// Override agCalc with contextual interpretation
function agCalcFull(){
  const na=cN("na"),cl=cN("cl"),hco3=cN("hco3"),alb=cN("alb"),lac=cN("ag_lac"),ph=cN("ag_ph"),paco2=cN("ag_paco2");
  if(isNaN(na)||isNaN(cl)||isNaN(hco3)){cSet("ag","<span style='color:#4a7a4a'>Preencha Na⁺, Cl⁻ e HCO₃⁻.</span>");return;}
  const{ag,agCorr}=RechCalc.anionGapCore(na,cl,hco3,alb);
  let out="";

  // AG interpretation
  const{msg:agMsg,col:agCol}=RechCalc.classifyAnionGapFull(agCorr);
  out+=`<div style="margin-bottom:6px">AG: ${cFmt(ag,"mEq/L")} ${!isNaN(alb)?`| AG corrigido: ${cFmt(agCorr,"mEq/L")}`:"— sem albumina"}${cAlrt(agMsg,agCol)}</div>`;

  // Delta ratio if AG elevated
  if(agCorr>12){
    const{ratio,msg:drMsg,col:drCol}=RechCalc.deltaRatioFull(agCorr,hco3);
    out+=`<div style="margin-top:6px">Delta ratio: ${cFmt(ratio,"",2)} ${cAlrt(drMsg,drCol)}</div>`;
  }

  // pH / PaCO2 if provided
  if(!isNaN(ph)&&!isNaN(paco2)){
    const{paco2Exp:paco2_exp,compOK}=RechCalc.wintersFormula(hco3,paco2);
    out+=`<div style="margin-top:6px">${cAlrt(`PaCO₂ esperada (Winter): ${paco2_exp.toFixed(1)} mmHg | Medida: ${paco2} mmHg — ${compOK?"✅ Compensação respiratória adequada":"⚠️ Distúrbio respiratório coexistente (checar acidose/alcalose respiratória)"}`,"#60a5fa")}</div>`;
  }

  // Lactate if provided
  if(!isNaN(lac)){
    const{msg:lacMsg,col:lacCol}=RechCalc.classifyLactate(lac);
    out+=`<div style="margin-top:6px">${cAlrt(lacMsg,lacCol)}</div>`;
  }

  // Clinical context warning
  out+=`<div style="margin-top:8px;font-size:10px;color:#4a7a4a;border-top:1px solid #0d3b18;padding-top:6px">AG correto pela albumina é obrigatório em UTI (hipoalbuminemia mascara AG elevado). Sempre correlacionar com pH, PaCO₂, lactato, cetonas, ureia, osmolalidade.</div>`;
  cSet("ag",out);
}function mdR(text){
  if(!text)return"";
  let h=text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^## (.+)$/gm,"<h2>$1</h2>")
    .replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/^- (.+)$/gm,"<li>$1</li>")
    .replace(/\n\n/g,"<br><br>")
    .replace(/\n/g,"<br>");
  return h;
}

      S.resultQ=r;addSS("questoes",r);

      const r=await api(SYS[k]+modoCtx,PS(t,st,S.nqs),"simulado");if(!isRunActive(run))return;S.resultS=r;S.gabVis=false;addSS("simulado",r);
    }else if(S.tab==="pontos"){
      const r=await api(SYS[k]+modoCtx,PP[k](t,st,f),"pontos");if(!isRunActive(run))return;S.resultP=r;addSS("pontos",r);
    }else if(S.tab==="flashcards"){
      const r=await api("Gere APENAS JSON de flashcards médicos. Zero texto fora do array."+modoCtx,PF(t,st,n),"flashcards");
      if(!isRunActive(run))return;
      const parsed=parseFC(r);
      const novos=parsed.map(c=>({...c,_tema:t}));
      S.fc=[...novos,...S.fc];svFC();
      const hist=novos.map((c,i)=>`## Flashcard ${i+1}\n**Frente:** ${c.frente}\n\n**Verso:** ${c.verso}\n\n**Mecanismo:** ${c.mecanismo}\n\n**Armadilha:** ${c.armadilha}\n\n**Guideline:** ${c.guideline}\n\n**Dificuldade:** ${c.dificuldade}`).join("\n\n---\n\n");
      addSS("flashcards",hist);
    }
  }catch(ex){S.error=ex.message;}
  S.loading=false;S.contentStatus=S.error?"idle":"done";render();
}

function rFC(){

  const td=new Date().toISOString().slice(0,10);const st={t:all.length,hj:all.filter(c=>c._next&&c._next<=td).length,p:all.filter(c=>!c._st).length,f:all.filter(c=>c._st==="facil").length,d:all.filter(c=>c._st==="dificil").length,e:all.filter(c=>c._st==="errei").length};
  const idx=Math.min(S.fci,Math.max(fil.length-1,0)),card=fil[idx];
  let h=`<div class="cpanel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-size:13px;font-weight:500">Flashcards <span style="color:#7aab7a;font-size:11px;font-weight:400">(${all.length}) · 2 por geração</span></div>${all.length?`<button class="btn-sm" style="color:#f87171;border-color:#7f1d1d" onclick="if(confirm('Limpar tudo?')){S.fc=[];svFC();document.getElementById('main').innerHTML=rFC()}">Limpar</button>`:""}</div>

  if(!all.length){h+=`<div class="empty">Configure o tema acima e clique em <strong>Gerar — Flashcards</strong><br><span style="font-size:11px;margin-top:4px;display:block">Gera 2 cards por vez · clique várias vezes para acumular</span></div>`;}

      <div style="display:flex;justify-content:space-between;margin-bottom:10px"><span class="${dc}">${card.dificuldade||"?"}</span><span style="font-size:10px;color:#7aab7a">${S.fcfl?"verso · clique para voltar":"frente · clique para virar"}</span></div>
      ${!S.fcfl?`<div style="font-size:14px;font-weight:500;text-align:center;padding:6px 0;line-height:1.5">${esc(card.frente||"")}</div>`:`<div style="font-size:13px;color:#86efac;font-weight:500;margin-bottom:6px;line-height:1.5">${esc(card.verso||"")}</div>${S.fcm?`<div style="border-top:0.5px solid #173d1f;padding-top:7px;margin-top:4px;display:flex;flex-direction:column;gap:3px"><p style="font-size:11px;color:#7aab7a"><strong style="color:#e8f5e9">Mecanismo:</strong> ${esc(card.mecanismo||"")}</p><p style="font-size:11px;color:#7aab7a"><strong style="color:#fbbf24">⚠ Armadilha:</strong> ${esc(card.armadilha||"")}</p><p style="font-size:11px;color:#7aab7a"><strong style="color:#e8f5e9">Guideline:</strong> ${esc(card.guideline||"")}</p></div>`:`<span style="font-size:11px;color:#7aab7a;cursor:pointer;text-decoration:underline" onclick="event.stopPropagation();S.fcm=true;document.getElementById('main').innerHTML=rFC()">ver mecanismo + armadilha</span>`}`}
    </div>`;

  }

function rateFC(orig,st){
  S.fc[orig]._st=st;
  const today=new Date();
  const days=st==="facil"?7:st==="dificil"?2:1;
  today.setDate(today.getDate()+days);
  S.fc[orig]._next=today.toISOString().slice(0,10);
  S.fc[orig]._rev=(S.fc[orig]._rev||0)+1;
  if(st==="errei")S.fc[orig]._err=(S.fc[orig]._err||0)+1;
  svFC();S.fcfl=false;S.fcm=false;
  const td=new Date().toISOString().slice(0,10);
  const f=S.fcf==="todos"?S.fc:S.fcf==="hoje"?S.fc.filter(c=>c._next&&c._next<=td):S.fcf==="pendente"?S.fc.filter(c=>!c._st):S.fc.filter(c=>c._st===S.fcf);
  S.fci=Math.min(S.fci+1,Math.max(f.length-1,0));
  document.getElementById("main").innerHTML=rFC();
}

    else{h+=`<div class="empty" style="padding:20px"><div style="margin-bottom:12px;color:#7aab7a">Bloco não gerado ainda.</div><button class="btn btn-t" style="padding:8px 18px;font-size:13px" onclick="gerarBloco('${S.rativo}')">▶ Gerar este bloco</button></div>`;}

  }else{h+=`<div class="empty">Selecione um bloco na lista,<br>ou clique em <strong>▶ Gerar próximo pendente</strong>.</div>`;}
  return h;
}

async function gerarBloco(id){

async function planejar(){

function vmCalcPBW(){
  if(!window.vmSex)window.vmSex='M';
  const h=parseFloat(document.getElementById("vm_altura")?.value||"");

function vmCalc(){
  const pp=g("vm_pp"),peep=g("vm_peep"),vt=g("vm_vt"),peso=window.vmPBW||NaN;
  let dRes="";
  if(!isNaN(pp)&&!isNaN(peep)){
    const dp=RechCalc.drivingPressure(pp,peep);
    const{msg,col}=RechCalc.classifyDPVentilacao(dp);
    dRes+=`<div>Driving Pressure: ${vmFmt(dp,"cmH₂O")} ${vmAlert(msg,col)}</div>`;
  }
  if(!isNaN(pp)&&!isNaN(peep)&&!isNaN(vt)&&vt>0){
    const cst=RechCalc.staticCompliance(vt,pp,peep);
    const{msg:cmsg,col:cstCol}=RechCalc.classifyComplianceVentilacao(cst);
    dRes+=`<div style="margin-top:6px">Compliance estática: ${vmFmt(cst,"mL/cmH₂O")} ${vmAlert(cmsg,cstCol)}</div>`;
    if(!isNaN(peso)&&peso>0){
      const vtkg=RechCalc.calcVtPerKgPBW(vt,peso);
      const{msg:vmsg,col:vtCol}=RechCalc.classifyVtKgVentilacao(vtkg);
      dRes+=`<div style="margin-top:6px">Vt/kg PBW: ${vmFmt(vtkg,"mL/kg")} ${vmAlert(vmsg,vtCol)}</div>`;
    }
  }
  const p01=g("vm_p01");
  if(!isNaN(p01)){
    const{msg:pmsg,col:p01Col}=RechCalc.classifyP01Ventilacao(p01);
    dRes+=`<div style="margin-top:6px">P0.1: ${vmFmt(p01,"cmH₂O")} ${vmAlert(pmsg,p01Col)}</div>`;
  }
  const fr=g("vm_fr"),vtsp=g("vm_vtsp");
  if(!isNaN(fr)&&!isNaN(vtsp)&&vtsp>0){
    const tobin=RechCalc.tobinIndex(fr,vtsp);
    const{msg:tmsg,col:tobinCol}=RechCalc.classifyTobinVentilacao(tobin);
    dRes+=`<div style="margin-top:6px">Índice de Tobin (f/Vt): ${vmFmt(tobin,"ipm/L",0)} ${vmAlert(tmsg,tobinCol)}</div>`;
  }
  vmSet("vm_calc_res", dRes||`<span style="color:#4a7a4a">Preencha os campos acima para calcular.</span>`);
}

async function vmRevGerar(tema){
  const run=newRun();
  if(!tema||!tema.trim()){alert("Informe o subtema.");return;}
  window.vmRevTema=tema;
  const out=document.getElementById("vm_rev_out");
  if(out)out.innerHTML=`<div style="text-align:center;padding:24px;color:#7aab7a"><span class="spin-sm"></span> Gerando revisão TEMI...</div>`;
  const sys=`Professor de medicina intensiva. Interlocutor: intensivista TEMI 2026. NUNCA simplifique. **Negrito** críticos, ⚠️ alertas, ✅ confirmações. Tabelas markdown. ASCII. Fisiopatologia integrada. Guidelines com nível evidência.`;
  const prompt=`Tema: Ventilação Mecânica — ${tema}\nNível: Expert UTI / TEMI 2026\n\nGere apostila completa:\n## Definição/Conceito\n## Fisiopatologia integrada\n## Parâmetros-chave e metas (tabela)\n## Indicações e contraindicações\n## Armadilhas clínicas\n## Efeitos hemodinâmicos\n## Conduta prática UTI (ASCII quando útil)\n## Guidelines e nível evidência\n## Pontos TEMI\n\nMáx 2000 tokens.`;
  try{
    const r=await api(sys,prompt,"vm");
    if(!isRunActive(run))return;
    window.vmRevRes=r;
    if(out)out.innerHTML=`<div class="cpanel"><div style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:8px"><button class="btn-sm" onclick="navigator.clipboard?.writeText(window.vmRevRes)">📋</button><button class="btn-dl" onclick="dl(window.vmRevRes,'vm_${Date.now()}.md','text/markdown')">↓.md</button></div><div class="content">${mdR(r)}</div></div>`;
    addSS("vm_revisao","VM: "+tema+"\n\n"+r);
  }catch(ex){
    if(out)out.innerHTML=`<div class="err">Erro: ${ex.message}</div>`;
  }
}
