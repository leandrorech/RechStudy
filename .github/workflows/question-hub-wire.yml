name: RechStudy question hub wire
on:
  push:
    branches: [feat/rechstudy-question-hub]
permissions:
  contents: write
jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire question hub script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="study-navigation.js"></script>'
          anchor='<script src="rech-ai-config.js"></script>'
          if marker not in s:
              if anchor not in s:
                  raise SystemExit('anchor rech-ai-config.js not found')
              s=s.replace(anchor, marker+'\n'+anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Static checks
        run: |
          node --check study-navigation.js
          grep -q '<script src="study-navigation.js"></script>' index.html
      - name: Test suite
        run: |
          npm ci
          npm test
      - name: Commit wiring when needed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: wire consolidated Questões navigation'
          git push origin HEAD:feat/rechstudy-question-hub
