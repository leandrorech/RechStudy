name: Apply wide desktop layout

on:
  push:
    branches:
      - feat/wide-desktop-layout

permissions:
  contents: write

jobs:
  patch-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wide-desktop-layout

      - name: Patch only the RechStudy shell width
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\.app\s*\{\s*max-width\s*:\s*900px\s*;\s*margin\s*:\s*0\s+auto\s*;?\s*\}'
          replacement = '.app{width:100%;max-width:1600px;margin:0 auto}'
          updated, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              matches = re.findall(r'\.app\s*\{[^}]*\}', s)
              raise SystemExit(f'Expected one 900px .app target, found {count}. Existing .app rules: {matches[:5]}')
          p.write_text(updated, encoding='utf-8')
          print('Applied:', replacement)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Run existing tests
        run: |
          npm ci
          npm test

      - name: Remove temporary workflow and commit only final patch
        run: |
          rm .github/workflows/apply-wide-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: widen RechStudy desktop layout'
          git push origin HEAD:feat/wide-desktop-layout
